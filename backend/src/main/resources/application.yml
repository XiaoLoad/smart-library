server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 自定义业务配置
app:
  upload-dir: ./uploads

# 自定义 JWT 配置
jwt:
  secret: Zmxhc2gtZGVtby1saWJyYXJ5LWp3dC1zZWNyZXQta2V5LWZvci0yMDI2LTExLWNvbW11bml0eQ==
  expire-ms: 604800000

logging:
  level:
    com.library.mapper: DEBUG

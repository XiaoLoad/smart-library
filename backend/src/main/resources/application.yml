server:
  # 端口用环境变量可覆盖（默认 8090）。
  # 为何不用 8080/8081：8080 常被其他反代工具占用（如 ZCode 的 zcode-proxy），
  # 8081 是 Windows IP Helper(svchost) 的动态占用端口；两者冲突都会导致
  # 前端代理打到错误的服务、登录必然失败。8090 为空闲端口。
  port: ${SERVER_PORT:8090}
  # 监听所有网卡，局域网设备可通过本机 IP 访问后端（默认虽为 0.0.0.0，显式声明更稳妥）
  address: 0.0.0.0
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

spring:
  config:
    # 自动导入本地 .env（properties 格式，已被 .gitignore 忽略，勿提交）；
    # 两个路径分别兼容"以 backend 为工作目录"与"以仓库根为工作目录"两种启动方式
    import: optional:file:.env[.properties],optional:file:backend/.env[.properties]

  datasource:
    # createDatabaseIfNotExist：库不存在时自动建库（字符集跟随连接，仍建议服务端默认 utf8mb4）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/library_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}        # 机密项：缺失即启动失败，真实值通过环境变量 / application-local.yml 注入
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 本地默认激活 dev profile（见 application-dev.yml，恢复 mapper SQL 调试日志）
  profiles:
    active: dev

  # Flyway 数据库迁移：唯一的数据库结构/种子事实来源（classpath:db/migration）。
  # 全新库（无任何表）：V1~V8 自动建库表 + 灌种子数据（V8 为幂等种子），无需手动执行任何 SQL；
  # 已有库（表已存在但无迁移记录）：baseline-on-migrate 跳到 baseline-version 后继续跑后续迁移，
  #   V8 种子为幂等写法（INSERT IGNORE / ON DUPLICATE KEY UPDATE），重复执行无副作用。
  # 后续表结构变更请新增 V{n}__*.sql 迁移，勿改动已发布的 V1~V8（checksum 校验）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 自定义业务配置
app:
  upload-dir: ./uploads
  # CORS 白名单：逗号分隔的允许来源（局域网设备访问时把对应来源加入此处）
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  # AI 接口限流（滑动窗口，每分钟请求数）
  rate-limit:
    ai-chat-per-minute: 10
    ai-confirm-per-minute: 20
  # 模型请求/响应日志（打印完整 prompt 与工具结果，含个人借阅数据，生产建议 false）
  ai:
    log-requests: true
    log-responses: true

# 自定义 JWT 配置
jwt:
  secret: ${JWT_SECRET}            # 机密项：HS256 要求 ≥32 字节随机串，缺失即启动失败
  expire-ms: ${JWT_EXPIRE_MS:86400000}   # 默认 24 小时

# 微信小程序登录（code2session）
wechat:
  appid: ${WECHAT_APPID:}          # 小程序 AppID；留空则不启用小程序登录（调用时返回"未配置"友好提示）
  secret: ${WECHAT_SECRET:}        # 机密项：小程序后台获取，生产建议用环境变量注入

logging:
  level:
    com.library: INFO

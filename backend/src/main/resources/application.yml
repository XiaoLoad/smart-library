server:
  port: 8080
  # 监听所有网卡，局域网设备可通过本机 IP 访问后端（默认虽为 0.0.0.0，显式声明更稳妥）
  address: 0.0.0.0
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

spring:
  datasource:
    # createDatabaseIfNotExist：库不存在时自动建库（字符集跟随连接，仍建议服务端默认 utf8mb4）
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 本地默认激活 dev profile（见 application-dev.yml，恢复 mapper SQL 调试日志）
  profiles:
    active: dev

  # Flyway 数据库迁移：唯一的数据库结构/种子事实来源（classpath:db/migration）。
  # 全新库（无任何表）：V1~V8 自动建库表 + 灌种子数据（V8 为幂等种子），无需手动执行任何 SQL；
  # 已有库（表已存在但无迁移记录）：baseline-on-migrate 跳到 baseline-version 后继续跑后续迁移，
  #   V8 种子为幂等写法（INSERT IGNORE / ON DUPLICATE KEY UPDATE），重复执行无副作用。
  # 后续表结构变更请新增 V{n}__*.sql 迁移，勿改动已发布的 V1~V8（checksum 校验）。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 自定义业务配置
app:
  upload-dir: ./uploads

# 自定义 JWT 配置
jwt:
  secret: Zmxhc2gtZGVtby1saWJyYXJ5LWp3dC1zZWNyZXQta2V5LWZvci0yMDI2LTExLWNvbW11bml0eQ==
  expire-ms: 604800000

# 微信小程序登录（code2session）
wechat:
  appid: wxa7fc8f402fc5c127        # ← 替换为小程序 AppID
  secret: 6d7e26dfef8c95faa229b5c45ed7d10d  # ← 小程序后台获取，生产建议用环境变量注入

logging:
  level:
    com.library: INFO

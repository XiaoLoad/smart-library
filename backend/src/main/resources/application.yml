server:
  port: 8080
  # 监听所有网卡，局域网设备可通过本机 IP 访问后端（默认虽为 0.0.0.0，显式声明更稳妥）
  address: 0.0.0.0
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=CONVERT_TO_NULL
    username: root
    password: REPLACE_WITH_YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql

  # 本地默认激活 dev profile（见 application-dev.yml，恢复 mapper SQL 调试日志）
  profiles:
    active: dev

  # Flyway 数据库迁移：
  # 现有库经 baseline-on-migrate 跳过 V1（DDL 已存在），仅执行 V2（补外键）；
  # 全新库则 V1+V2 全跑。后续表结构变更请新增 V{n}__*.sql 迁移。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.library.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# 自定义业务配置
app:
  upload-dir: ./uploads

# 自定义 JWT 配置
jwt:
  secret: REPLACE_WITH_YOUR_JWT_SECRET
  expire-ms: 604800000

# 微信小程序登录（code2session）
wechat:
  appid: touristappid        # ← 替换为小程序 AppID
  secret: REPLACE_WITH_YOUR_WECHAT_SECRET  # ← 小程序后台获取，生产建议用环境变量注入

logging:
  level:
    com.library: INFO

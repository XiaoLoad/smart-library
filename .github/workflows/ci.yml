name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- 变更路径检测：决定后续 job 是否运行 ----------
  paths:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      miniprogram: ${{ steps.filter.outputs.miniprogram }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            miniprogram:
              - 'miniprogram/**'

  # ---------- 后端：编译 + 测试 ----------
  backend:
    needs: paths
    if: needs.paths.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
      - name: Build & Test
        working-directory: backend
        run: mvn -B verify

  # ---------- Web 前端：构建 ----------
  frontend:
    needs: paths
    if: needs.paths.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: pnpm build

  # ---------- 微信小程序：Node 语法检查（无密钥无法编译） ----------
  miniprogram:
    needs: paths
    if: needs.paths.outputs.miniprogram == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          find miniprogram-reader -name "*.js" -not -path "*/node_modules/*" -not -path "*/miniprogram_npm/*" -print0 \
            | xargs -0 -n1 node --check
          echo "✓ 小程序 JS 语法检查通过"

  # ---------- 仓库卫生：禁止爬虫目录/运行时数据/冗余锁文件入库 ----------
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check forbidden paths
        run: |
          ERR=0
          for pat in 'backend/uploads/' 'spider/' '.workbuddy/' '*.pyc' 'frontend/yarn.lock' 'frontend/package-lock.json' 'db/patch_'; do
            FILES=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" 2>/dev/null | grep -F "$pat" || true)
            if [ -n "$FILES" ]; then
              echo "::error::以下文件禁止入库（匹配 $pat）:"; echo "$FILES"
              ERR=1
            fi
          done
          exit $ERR

  # ---------- 提交信息规范（PR 标题需符合 Conventional Commits） ----------
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
          const t = process.env.TITLE;
          const re = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\((backend|frontend|miniprogram|db|ai|rag|spider|docs|ci)\))?(!)?: .+/;
          if (!re.test(t)) {
            console.error("✗ PR 标题不符合规范: " + t);
            console.error("  格式: <type>(<scope>): <subject>");
            process.exit(1);
          }
          console.log("✓ PR 标题符合 Conventional Commits");
          '
